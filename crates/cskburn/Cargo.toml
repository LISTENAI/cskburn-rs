[package]
name = "cskburn"
version = "2.0.0-alpha.2"
description = "Core library for programming LISTENAI CSK series chips"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
hex = ["dep:ihex"]

[dependencies]
binrw = "0.15.0"
ihex = { version = "3.0.0", optional = true }
log = { workspace = true }
serialport = ">=4.7, <5"
slip-codec = "0.4.0"
thiserror = "2.0.12"
